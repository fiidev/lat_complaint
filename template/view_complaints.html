<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints - School Complaint System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">
    <a href="view_rooms.html">Rooms</a>
    <a href="view_categories.html">Categories</a>
    <a href="view_complaints.html">Complaints</a>
    <a href="login.html">Logout</a>
  </div>

  <div class="l-wrap">
    <div class="l-main-article">
      <a href="add_complaint.html" class="button">+ Submit New Complaint</a>

      <table>
        <thead>
          <tr>
            <th>Ticket #</th>
            <th>Title</th>
            <th>Room</th>
            <th>Category</th>
            <th>Status</th>
            <th>Date</th>
            <th>Action</th>

        </thead>
        <tbody>
          <tr>
            <td>#1</td>
            <td><strong>AC Mati Total</strong></td>
            <td>Lab Komputer 1 (Gedung A)</td>
            <td>Kerusakan Fasilitas AC</td>
            <td><span class="badge badge-warning">Submitted</span></td>
            <td>2026-10-27</td>
            <td>
              <button style="background: #28a745;">Accept</button>
              <button style="background: #dc3545;">Reject</button>
            </td>
          </tr>
          <tr>
            <td>#2</td>
            <td><strong>Lampu Kedip-kedip</strong></td>
            <td>Ruang Teori RPL (Gedung B)</td>
            <td>Kelistrikan</td>
            <td><span class="badge badge-success">Accepted</span></td>
            <td>2026-10-26</td>
            <td>
              <span class="badge badge-success">Processing</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
