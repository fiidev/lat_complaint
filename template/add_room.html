<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Room - School Complaint System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">
    <a href="view_rooms.html">Rooms</a>
    <a href="view_categories.html">Categories</a>
    <a href="view_complaints.html">Complaints</a>
    <a href="login.html">Logout</a>
  </div>

  <div class="l-wrap" style="max-width: 600px;">
    <div class="l-main-article">
      <h2>Add New Room</h2>
      <form action="rooms" method="POST">
        <div class="group">
          <span>Building</span>
          <input type="text" name="building" placeholder="Contoh: Gedung A" required>
        </div>

        <div class="group">
          <span>Room Number</span>
          <input type="text" name="room_number" placeholder="Contoh: 101" required>
        </div>

        <div class="group">
          <span>Room Name</span>
          <input type="text" name="name" placeholder="Contoh: Lab Jaringan" required>
        </div>

        <div class="group">
          <label>
            <input type="checkbox" name="is_active" checked> Is Active Room
          </label>
        </div>

        <div>
          <button type="submit">Save Room</button>
          <a href="view_rooms.html" class="button" style="background: #777;">Back</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
