<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Ticket - School Complaint System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">
    <a href="view_rooms.html">Rooms</a>
    <a href="view_categories.html">Categories</a>
    <a href="view_admin_complaints.html">Review Complaints</a>
    <a href="view_reports.html">Reports</a>
    <a href="login.html">Logout</a>
  </div>

  <div class="l-wrap" style="max-width: 600px;">
    <div class="l-main-article">
      <h2>Assign Ticket to Staff</h2>
      <p style="color: #666; font-size: 14px;">Complaint #102: Kabel Proyektor Konslet (Ruang Teori RPL)</p>

      <form action="admin/complaints/102/tickets" method="POST">
        <div class="group">
          <span>Assign to Staff</span>
          <select name="assigned_to" required>
            <option value="">-- Select Staff Technician --</option>
            <option value="2">Joko Supriyanto (Staff IT & Kelistrikan)</option>
            <option value="3">Bambang Hariyadi (Staff Sarpras AC)</option>
          </select>
        </div>

        <div class="group">
          <span>Priority Level</span>
          <select name="priority" required>
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High / Urgent Priority</option>
          </select>
        </div>

        <div class="group">
          <span>Instruction / Internal Note</span>
          <textarea name="note" rows="3" placeholder="Instruksi pengerjaan untuk teknisi lapangan..."></textarea>
        </div>

        <div>
          <button type="submit">Create Ticket</button>
          <a href="view_admin_complaints.html" class="button" style="background: #777;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
