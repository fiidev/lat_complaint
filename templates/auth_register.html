<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Register - Complaint App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-sm">
    <div class="card">
      <h2 class="card-title" style="text-align: center; margin-bottom: 1.5rem;">Daftar Akun Baru</h2>

      <form>
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Nama lengkap" required>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Username unik" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Password minimal 6 karakter" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Daftar Sekarang</button>
      </form>

      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
        Sudah punya akun? <a href="auth_login.html" style="color: #2563eb; text-decoration: none;">Masuk di sini</a>
      </p>
    </div>
  </div>
</body>
</html>
