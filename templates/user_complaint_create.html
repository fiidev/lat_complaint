<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Buat Aduan Baru - User</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="top-bar">
    <h2>Sistem Pengaduan Sarpras</h2>
    <div class="nav-links">
      <a href="user_complaint_list.html">Aduan Saya</a>
      <a href="user_complaint_create.html" style="font-weight: 600;">Buat Aduan</a>
      <button class="btn btn-sm btn-secondary">Logout</button>
    </div>
  </nav>

  <div class="container-sm">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Form Lapor Kerusakan</h3>
        <a href="user_complaint_list.html" class="btn btn-secondary btn-sm">Batal</a>
      </div>

      <form>
        <div class="form-group">
          <label for="title">Judul Pengaduan</label>
          <input type="text" id="title" name="title" class="form-control" placeholder="Contoh: Monitor PC 04 Rusak" required>
        </div>

        <div class="form-group">
          <label for="room_id">Ruangan</label>
          <select id="room_id" name="room_id" class="form-control" required>
            <option value="">-- Pilih Ruangan --</option>
            <option value="1">Lab Komputer 1</option>
            <option value="2">Ruang Guru</option>
            <option value="3">Kelas X RPL 1</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category_id">Kategori Kerusakan</label>
          <select id="category_id" name="category_id" class="form-control" required>
            <option value="">-- Pilih Kategori --</option>
            <option value="1">Perangkat Keras (Hardware)</option>
            <option value="2">Kelistrikan</option>
            <option value="3">Fasilitas Fisik</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Deskripsi Kerusakan</label>
          <textarea id="description" name="description" class="form-control" rows="3" placeholder="Jelaskan detail kerusakan sarana/prasarana..." required></textarea>
        </div>

        <div class="form-group">
          <label for="evidence_image">Foto Bukti (Opsional)</label>
          <input type="file" id="evidence_image" name="evidence_image" class="form-control" accept="image/png, image/jpeg, image/webp">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Kirim Laporan</button>
      </form>
    </div>
  </div>
</body>
</html>
