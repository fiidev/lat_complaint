<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Complaint App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-sm">
    <div class="card">
      <h2 class="card-title" style="text-align: center; margin-bottom: 1.5rem;">Masuk ke Akun</h2>
      
      <!-- Contoh pesan error jika gagal login -->
      <!-- <div class="alert alert-danger">Username atau password salah</div> -->

      <form>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Masukkan username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Masuk</button>
      </form>

      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
        Belum punya akun? <a href="auth_register.html" style="color: #2563eb; text-decoration: none;">Daftar di sini</a>
      </p>
    </div>
  </div>
</body>
</html>
