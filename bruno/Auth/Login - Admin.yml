info:
  name: Login - Admin
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@admin.com",
        "password": "admin123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.token) {
          bru.setEnvVar("admin_token", res.body.data.token);
          bru.setEnvVar("token", res.body.data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
