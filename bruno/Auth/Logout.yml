info:
  name: Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/auth/logout"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
