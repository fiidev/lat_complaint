info:
  name: Login - Staff
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "staff@staff.com",
        "password": "staff123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.token) {
          bru.setEnvVar("staff_token", res.body.data.token);
          bru.setEnvVar("token", res.body.data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
