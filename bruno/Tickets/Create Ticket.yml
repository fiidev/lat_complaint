info:
  name: Admin - Create & Assign Ticket
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/admin/complaints/{{complaint_id}}/tickets"
  body:
    type: json
    data: |-
      {
        "assigned_to": 2,
        "priority": "high",
        "note": "Perbaiki stop kontak di Lab Komputer 1 segera."
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.id) {
          bru.setEnvVar("ticket_id", res.body.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
