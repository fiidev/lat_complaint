info:
  name: Staff or Admin - Add Progress Note
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/tickets/{{ticket_id}}/histories"
  body:
    type: json
    data: |-
      {
        "note": "Replacement part ordered; expected arrival tomorrow."
      }
  auth:
    type: bearer
    token: "{{staff_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
