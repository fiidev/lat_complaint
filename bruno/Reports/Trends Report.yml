info:
  name: Trends Report
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/admin/reports/complaints/trends?start_date=2026-09-01&end_date=2026-12-31&group_by=day"
  params:
    - name: start_date
      value: 2026-09-01
      type: query
    - name: end_date
      value: 2026-12-31
      type: query
    - name: group_by
      value: day
      type: query
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
