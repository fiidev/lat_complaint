info:
  name: Get Complaint Detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/complaints/{{complaint_id}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
