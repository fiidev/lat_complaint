info:
  name: Submit Complaint
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/complaints"
  body:
    type: multipart-form
    data:
      - name: room_id
        type: text
        value: "1"
      - name: category_id
        type: text
        value: "1"
      - name: title
        type: text
        value: Stop kontak meja depan berasap dan korslet
      - name: description
        type: text
        value: Terdapat percikan api saat kabel laptop dicolokkan ke stop kontak baris depan.
  auth:
    type: bearer
    token: "{{student_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.id) {
          bru.setEnvVar("complaint_id", res.body.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
