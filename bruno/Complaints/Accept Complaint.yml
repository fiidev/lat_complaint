info:
  name: Admin - Accept Complaint
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{base_url}}/admin/complaints/{{complaint_id}}/accept"
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
